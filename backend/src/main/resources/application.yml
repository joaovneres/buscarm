spring:
  application:
    name: buscarm
  datasource:
    # Em produção, defina DATABASE_URL no formato jdbc:postgresql://host:5432/db (Neon).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/buscarm}
    username: ${DB_USER:buscarm}
    password: ${DB_PASSWORD:buscarm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

buscarm:
  cors:
    # Origens permitidas do frontend, separadas por vírgula.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Em produção, defina JWT_SECRET (>= 32 bytes). O default é só para desenvolvimento.
    secret: ${JWT_SECRET:troque-este-segredo-de-desenvolvimento-buscarm-32bytes+}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin:
    # Usuário ADMIN inicial (criado só se o banco não tiver nenhum usuário).
    # Login por username (definido pelo admin). Em produção defina ADMIN_USERNAME e ADMIN_PASSWORD.
    nome: ${ADMIN_NOME:Administrador}
    username: ${ADMIN_USERNAME:admin}
    senha: ${ADMIN_PASSWORD:admin12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
