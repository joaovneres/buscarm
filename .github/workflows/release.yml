name: Release

# Ao criar uma tag SemVer (vX.Y.Z), gera automaticamente a imagem Docker versionada do
# backend (GHCR) e o build do frontend. NÃO faz deploy — isso é manual (deploy.yml). ADR-0005.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  backend-image:
    name: imagem-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Empacotar (Maven)
        working-directory: backend
        run: mvn -B -DskipTests package
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push da imagem versionada
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/buscarm-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/buscarm-backend:latest

  frontend-build:
    name: build-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.ref_name }}
          path: frontend/.next
