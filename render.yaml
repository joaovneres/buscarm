# Blueprint do Render para o backend do BuscaRM (T11.4).
# Alinhado ao ADR-0005 (Atualização 2026-08-24): o serviço BUILDA o backend/Dockerfile a partir
# do repo e faz DEPLOY AUTOMÁTICO a cada push na main (não usa a imagem do GHCR nem deploy hook).
#
# Como usar: New > Blueprint no Render, aponte para este repositório. Depois preencha os valores
# marcados como sync:false em Environment (segredos) — ver docs/deploy.md.
services:
  - type: web
    name: buscarm
    runtime: docker
    rootDir: backend            # o Dockerfile e o contexto de build ficam em backend/
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    autoDeploy: true            # publica a cada push na main
    healthCheckPath: /actuator/health
    envVars:
      # Banco Neon (Postgres). A URL JDBC vai sem usuário/senha; estes vão separados.
      - key: DATABASE_URL        # ex.: jdbc:postgresql://<host>.neon.tech/buscarm?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Segurança: Render gera um segredo forte para o JWT (>= 32 bytes).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "480"
      # Origem do frontend na Vercel (para o CORS). ex.: https://buscarm.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Admin inicial (criado só se o banco estiver sem usuários). Login é por USERNAME (V7).
      # NÃO use os defaults em produção.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
